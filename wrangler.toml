# 360SPRNG — new build (Figma UI)
#
# IMPORTANT — read before you deploy:
#
# 1) `name` below is "360sprng-website-next", NOT "360sprng-website" (the live
#    worker's name). This is deliberate: deploying under a different name spins
#    up a SEPARATE worker on a workers.dev subdomain instead of overwriting your
#    live site. When you're ready to actually cut over, either rename this to
#    "360sprng-website" and redeploy (replaces the live worker), or add a custom
#    domain/route for 360sprng.com to this worker in the Cloudflare dashboard.
#
# 2) `database_id` below points at the SAME D1 database your live site uses
#    (from your existing wrangler.toml). That means orders placed through this
#    build write to your real orders table — same data, one source of truth.
#    If you'd rather test with a throwaway database first, run
#    `wrangler d1 create 360sprng-orders-staging` and swap the id below.
#
# 3) `run_worker_first = true` is the fix for the bug found in the live site:
#    without it, Cloudflare serves matching static files directly and your
#    Worker (kill switch, security headers) never runs for normal page loads.
#
# 4) The Paystack public key hardcoded in store.html is a LIVE key
#    (pk_live_...). Any checkout you run against this build — staging or not —
#    is a real transaction. Swap in a Paystack TEST public key while you're
#    validating the new build, then swap back before the real cutover.

name = "360sprng-website"
compatibility_date = "2026-04-26"
main = "./_worker.js"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
run_worker_first = true

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "360sprng-orders"
database_id = "c19c59c6-be78-4146-998e-904bda9cf05b"
