            margin: 0;
            padding: 0;

        html {
            scroll-behavior: smooth;

        .nl-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 350;
            display: block;
            overflow: hidden;
            border-bottom: 1px solid rgba(242, 237, 228, 0.07);
            padding: 0.75rem 0;
            background: var(--black);
            text-decoration: none;
        }

        .nl-track {
            display: flex;
            animation: nl-scroll 22s linear infinite;
            white-space: nowrap;
            align-items: center;
        }

        .nl-bar:hover .nl-track {
            animation-play-state: paused;
        }

        .nl-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-right: 20px;
            flex-shrink: 0;
